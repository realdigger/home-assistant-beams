title: BEAMS
views:
  - title: Светильник
    path: light
    cards:
      - type: entities
        title: Управление
        show_header_toggle: false
        entities:
          - entity: binary_sensor.beams_2_pro_r_8_001_light
          - entity: switch.beams_2_pro_r_8_001_manual_mode
          - entity: switch.beams_2_pro_r_8_001_service_mode
          - entity: select.beams_2_pro_r_8_001_spectrum
          - entity: select.beams_2_pro_r_8_001_ruchnoi_rezhim_na
          - entity: sensor.beams_2_pro_r_8_001_until_auto_mode
