            **Яркость:** {{ state_attr('binary_sensor.beams_2_pro_r_8_001_light', 'channels_percent') | max | round(2) }} %

            | Канал | Уровень |
            |:--|--:|
            | CH1 | {{ state_attr('binary_sensor.beams_2_pro_r_8_001_light', 'channels_percent')[0] | round(2) }} % |
            | CH2 | {{ state_attr('binary_sensor.beams_2_pro_r_8_001_light', 'channels_percent')[1] | round(2) }} % |
            | CH3 | {{ state_attr('binary_sensor.beams_2_pro_r_8_001_light', 'channels_percent')[2] | round(2) }} % |
            | CH4 | {{ state_attr('binary_sensor.beams_2_pro_r_8_001_light', 'channels_percent')[3] | round(2) }} % |
            | CH5 | {{ state_attr('binary_sensor.beams_2_pro_r_8_001_light', 'channels_percent')[4] | round(2) }} % |
            | CH6 | {{ state_attr('binary_sensor.beams_2_pro_r_8_001_light', 'channels_percent')[5] | round(2) }} % |
            | CH7 | {{ state_attr('binary_sensor.beams_2_pro_r_8_001_light', 'channels_percent')[6] | round(2) }} % |
            | CH8 | {{ state_attr('binary_sensor.beams_2_pro_r_8_001_light', 'channels_percent')[7] | round(2) }} % |
            | CH9 | {{ state_attr('binary_sensor.beams_2_pro_r_8_001_light', 'channels_percent')[8] | round(2) }} % |
            | CH10 | {{ state_attr('binary_sensor.beams_2_pro_r_8_001_light', 'channels_percent')[9] | round(2) }} % |
